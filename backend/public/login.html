<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OBE System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h1>OBE UVERS</h1>
            <p>Sistem Pengelolaan Data OBE</p>
        </div>

        <form id="loginForm" class="login-form">
            <h2 class="login-title">Silakan Login</h2>

            <div class="input-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" placeholder="Masukkan email dosen" required>
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>

            <button type="submit" class="login-btn">Login ke Sistem</button>
            <div id="errorMsg" class="login-error"></div>
        </form>

        <div id="roleSelectionContainer" style="display: none; padding: 20px;">
            <h2 class="login-title" style="margin-bottom: 5px;">Pilih Role Aktif</h2>
            <p style="text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 14px;">Pilih salah satu role untuk sesi ini.</p>
            <div id="role-selection-buttons" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Buttons will be generated via auth.js -->
            </div>
        </div>
    </div>

    <!-- Script Firebase Client -->
    <script type="module" src="/js/auth.js"></script>
</body>

</html>
